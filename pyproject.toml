[project]
name = "qwen3-tts-post-training"
version = "0.1.0"
description = "GRPO post-training pipeline for Qwen3-TTS CustomVoice (Cyrene)"
readme = "README.md"
authors = [
    { name = "FelysNeko" }
]
requires-python = ">=3.12"
dependencies = [
    "torch==2.8.0",
    "torchvision==0.23.0",
    "torchaudio==2.8.0",
    "flash-attn @ https://github.com/Dao-AILab/flash-attention/releases/download/v2.8.3.post1/flash_attn-2.8.3.post1+cu12torch2.8cxx11abiTRUE-cp312-cp312-linux_x86_64.whl",
    "pydantic>=2",
    "httpx>=0.28",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.4",
]

[tool.ruff]
# vendored trees stay byte-faithful to upstream (ckpts must keep loading with
# matching state-dict keys / bit-identical kernels) — excluded from BOTH lint
# and format (`lint.per-file-ignores` alone does NOT protect against
# `ruff format`)
extend-exclude = [
    "workers/scorer/src/scorer/speakerlab",
    "workers/scorer/src/scorer/utmos",
    "workers/preprocess/src/preprocess/clearvoice",
]
