[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[project]
name = "q3tts-worker-scorer"
version = "0.1.0"
description = "Unified scoring worker: SV (ERes2NetV2/CAM++) + MOS (UTMOSv2) + WER (Qwen3-ASR), one process, one CUDA context (cuda:0)"
requires-python = ">=3.12"
dependencies = [
    "transformers>=5.15",
    "accelerate",
    "timm",
    "librosa",
    "modelscope>=1.17",
    "qwen3-tts-post-training",
    "fastapi[standard]>=0.141",
]

[tool.uv.sources]
qwen3-tts-post-training = { path = "../..", editable = true }

[tool.uv.build-backend]
module-name = "scorer"
namespace = true
