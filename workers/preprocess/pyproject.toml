[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[project]
name = "q3tts-worker-preprocess"
version = "0.1.0"
description = "Preprocessing worker: filter -> enhanced (clearvoice 48k) -> codes -> embedding, checksum-guarded per-stage caches (asset.jsonl + metrics.json), one CUDA context (cuda:1)"
requires-python = ">=3.12"
dependencies = [
    "qwen-tts==0.1.1",
    "einops",
    "rotary-embedding-torch==0.8.3",
    "soundfile>=0.12",
    "tqdm",
    "qwen3-tts-post-training",
]

[tool.uv.sources]
qwen3-tts-post-training = { path = "../..", editable = true }

[tool.uv.build-backend]
module-name = "preprocess"
namespace = true
